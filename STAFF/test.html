<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Staff Sidebar Test</title>
    <link rel="stylesheet" href="staff-sidebar.css">
</head>

<body>
    <div id="sidebar-container"></div>
    <script type="module">
        fetch("staff-sidebar.html")
            .then(response => {
                if (!response.ok) throw new Error("Unable to load staff-sidebar.html");
                return response.text();
            })
            .then(html => {
                document.getElementById("sidebar-container").innerHTML = html;
                const script = document.createElement("script");
                script.type = "module";
                script.src = "staff-sidebar.js";
                document.body.appendChild(script);
            })
            .catch(error => console.error(error));
    </script>
</body>

</html>
